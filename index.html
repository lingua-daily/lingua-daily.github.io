<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lingua — Daily Languages</title>
</head>
<body>
<script>
/* This page never changes. Everything else is fetched fresh, by version. */
(function () {
  function load(src) {
    return new Promise(function (done) {
      var s = document.createElement('script');
      s.src = src; s.onload = s.onerror = done;
      document.head.appendChild(s);
    });
  }
  fetch('version.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .catch(function () { return { v: String(Date.now()) }; })
    .then(function (ver) {
      var q = '?v=' + ver.v;
      var css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = 'styles.css' + q;
      document.head.appendChild(css);
      return load('layout.js' + q).then(function () {
        document.body.insertAdjacentHTML('afterbegin', window.LINGUA_LAYOUT);
        return load('content/languages.js' + q);
      }).then(function () {
        return load('content/daily.js' + q);
      }).then(function () {
        window.CONTENT = window.CONTENT || {};
        return Promise.all(window.LANGUAGES.map(function (c) { return load('content/' + c + '.js' + q); }));
      }).then(function () { return load('app.js' + q); });
    });
})();
</script>
</body>
</html>
